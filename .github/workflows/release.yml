name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.5"

      - name: Validate tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Tag {tag} does not match package version {expected}")
          PY

      - name: Build package
        run: uv build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Write release notes
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/releases/${GITHUB_REF_NAME}.md" release-notes.md
          else
            printf '# IMSim %s\n' "${GITHUB_REF_NAME}" > release-notes.md
          fi
          cat >> release-notes.md <<'EOF'

          Release artifacts are attached below.

          Container image:
          `ghcr.io/schmidtcode/imsim:${{ github.ref_name }}`

          Verify downloaded artifacts with `SHA256SUMS.txt`.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "IMSim ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
