name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . --config .gitleaks.toml --redact --verbose --no-banner

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14.5", "3.15.0"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Install browser for UI regression tests
        run: uv run playwright install --with-deps chromium
      - name: Pytest
        run: uv run pytest --run-browser
      - name: Build package
        run: uv build
      - name: Build container
        run: docker build -t imsim-ci .
      - name: Smoke test container runtime
        run: >-
          docker run --rm --entrypoint /app/.venv/bin/python imsim-ci
          -c 'from imsim.wsgi import server; assert server.test_client().get("/health").status_code == 200'
